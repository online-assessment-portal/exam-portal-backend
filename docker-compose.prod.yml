services:
  backend:
    image: ${IMAGE_NAME}
    container_name: exam-portal-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      DB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/exam_db?authSource=admin
    depends_on:
      - redis
      - mongo
    networks:
      - shredtest-network

  mongo:
    image: mongo:7
    container_name: exam-portal-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: exam_db
    volumes:
      - mongo-data:/data/db
    networks:
      - shredtest-network

  redis:
    image: redis:7-alpine
    container_name: exam-portal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - shredtest-network

volumes:
  redis-data:
  mongo-data:

networks:
  shredtest-network:
    driver: bridge
