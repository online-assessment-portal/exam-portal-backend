name: Deploy to EC2 via Docker

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/exam-portal-backend:latest
  CONTAINER_NAME: exam-portal-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKER_USERNAME }}/exam-portal-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}
          cache-to: type=inline

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/exam-portal-backend/"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/exam-portal-backend
            cd ~/exam-portal-backend

            cat > .env << EOF
            IMAGE_NAME=${{ env.IMAGE_NAME }}
            MONGO_USERNAME=${{ secrets.MONGO_USERNAME }}
            MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}
            AWS_SES_HOST=${{ secrets.AWS_SES_HOST }}
            AWS_SES_UID=${{ secrets.AWS_SES_UID }}
            AWS_SES_PSWD=${{ secrets.AWS_SES_PSWD }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            EOF

            echo ${{ secrets.DOCKER_PASSWORD }} | sudo docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.prod.yml up -d --wait --timeout 60

            if ! sudo docker compose -f docker-compose.prod.yml ps | grep -q "Up"; then
              echo "Deployment failed"
              sudo docker compose -f docker-compose.prod.yml logs --tail=50
              exit 1
            fi

            sudo docker image prune -f
            echo "Deployment successful"
